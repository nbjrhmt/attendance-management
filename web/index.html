<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乡村基层活动智能签到管理平台</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- ===================== 登录页 ===================== -->
<div id="login-view" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo">签</div>
      <div>
        <div class="brand-title">乡村基层活动智能签到管理平台</div>
        <div class="brand-sub">家庭为单位 · 人脸签到 · AI 智能助手</div>
      </div>
    </div>
    <div id="login-error" class="form-error hidden"></div>
    <form id="login-form" autocomplete="off">
      <label class="field">
        <span>账号</span>
        <input id="login-username" type="text" placeholder="管理员 / 工作人员 / 家庭户主账号" required>
      </label>
      <label class="field">
        <span>密码</span>
        <input id="login-password" type="password" placeholder="登录密码" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <div class="login-foot">
      家庭用户没有账号？<a href="javascript:void(0)" id="open-register">注册家庭账号</a>
    </div>
  </div>
</div>

<!-- ===================== 应用主界面 ===================== -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="topbar-brand">乡村基层活动智能签到管理平台</div>
    <div class="topbar-user">
      <span id="user-chip" class="user-chip"></span>
      <button id="logout-btn" class="btn btn-ghost btn-sm">退出</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <nav id="nav" class="nav">
        <button class="nav-item active" data-view="dashboard">总览</button>
        <button class="nav-item" data-view="events">活动签到</button>
        <button class="nav-item" data-view="leaves">请假管理</button>
        <button class="nav-item" data-view="chat">AI 智能助手</button>
      </nav>
    </aside>
    <main id="content" class="content"></main>
  </div>
</div>

<!-- ===================== 通用弹窗 ===================== -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <span id="modal-title"></span>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<div id="toast-wrap" class="toast-wrap"></div>

<script src="/static/app.js"></script>
</body>
</html>
